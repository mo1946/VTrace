spring.application.name=vtrace-business-backend
server.address=${VTRACE_BIND_ADDRESS:127.0.0.1}
server.port=${VTRACE_PORT:8080}

spring.datasource.url=${VTRACE_DB_URL:jdbc:mysql://127.0.0.1:3307/media_db?characterEncoding=UTF-8&connectionTimeZone=UTC}
spring.datasource.username=${VTRACE_DB_USERNAME:root}
spring.datasource.password=${VTRACE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true

spring.data.redis.url=${REDIS_URL:redis://127.0.0.1:6379/0}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
vtrace.redis.enabled=${VTRACE_REDIS_ENABLED:true}
vtrace.jwt-secret=${JWT_SECRET:development-only-change-me}
vtrace.max-analysis-attempts=${MAX_ANALYSIS_ATTEMPTS:3}
vtrace.rocketmq.nameserver=${ROCKETMQ_NAMESERVER:}
vtrace.rocketmq.topic=${ROCKETMQ_TOPIC:video-analysis-topic}
vtrace.rocketmq.producer-group=${ROCKETMQ_PRODUCER_GROUP:seeit-java-producer}
vtrace.rocketmq.send-timeout-ms=${ROCKETMQ_SEND_TIMEOUT_MS:3000}
